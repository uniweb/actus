name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: ""
          - features: "--features actus/compression,actus/websocket,actus/openapi"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.features }}

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: ""
          - features: "--features actus/compression,actus/websocket,actus/openapi"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ matrix.features }}

  msrv:
    name: minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 1.88 is the floor: edition 2024 needs 1.85, but the crate uses `let`
      # chains (`if let … && let …`), stabilized in 1.88.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The 1.0 stability promise, machine-checked: every crate's public API is
  # diffed against its latest crates.io release. `release-type: minor` because
  # `main` legitimately accumulates additive (minor-level) API between
  # releases; what must never appear on a 1.x `main` is a MAJOR-level change —
  # a removed item, a changed signature, a new field on an all-`pub` struct.
  # `release.sh` runs the stricter form (the release type derived from the
  # actual version bump) before a tag exists. See docs/2.0-docket.md §3.
  semver:
    name: cargo-semver-checks (no breaking change since the last release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          release-type: minor
          feature-group: all-features
